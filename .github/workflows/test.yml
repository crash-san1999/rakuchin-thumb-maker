name: テスト
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: TypeScript を入れる（型チェック用。版は tests/test_typecheck.py の TS_VERSION と合わせる）
        run: npm install -g typescript@6.0.3
      - name: Playwright を入れる
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: 全テストを実行（1件ごとの制限時間つき）
        run: python3 tests/run_all.py
