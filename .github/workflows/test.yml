name: テスト
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わる。Playwright の依存パッケージ・日本語フォントの入れ方が変わりうるので、版を固定しておき、上げるときは確かめてから
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: TypeScript を入れる（型チェック用。版は tests/test_typecheck.py の TS_VERSION と合わせる）
        run: npm install -g typescript@6.0.3
      - name: Playwright を入れる
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: 全テストを実行（1件ごとの制限時間つき・並列。数は run_all.py の既定＝CPU の数の 2 倍・最大 6）
        run: python3 tests/run_all.py
  # 見た目の比較（プルリクエストのときだけ）：ベースのブランチ（main）と、描画結果をピクセル単位・HTML を 1 文字単位で比べる（tests/compare_render.py）。
  # 「見た目を変えない整理」なら一致するはず。見た目を変える変更では違いが出て失敗するので、出た違いが意図どおりかをログで確かめる
  render-compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: 比べる相手（ベースのブランチ）を取ってくる
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Playwright を入れる
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: ベースのブランチと描画結果を比べる
        run: python3 tests/compare_render.py FETCH_HEAD
